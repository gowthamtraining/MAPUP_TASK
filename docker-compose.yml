services:
  # PostgreSQL with PostGIS Spatial Extension
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: mapup-postgis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: geouser
      POSTGRES_PASSWORD: geopass
      POSTGRES_DB: geotracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geouser -d geotracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Golang Backend REST & WebSocket Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mapup-geofence-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://geouser:geopass@db:5432/geotracker?sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # React + Vite Production Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:8080"
        VITE_WS_URL: "ws://localhost:8080/ws/alerts"
    container_name: mapup-geofence-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
